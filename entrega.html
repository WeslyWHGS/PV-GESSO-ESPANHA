<!DOCTYPE html>
<html lang="es-419">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Entrega — Yeso Lucrativo</title>
    <meta name="description" content="Accede aquí a todos tus materiales del método Yeso Lucrativo.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fdf6ef;
            color: #3d2b1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            border: 1.5px solid #e0ccb8;
            box-shadow: 0 20px 60px rgba(107, 76, 59, 0.12);
            max-width: 440px;
            width: 100%;
            padding: 2.8rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.4rem;
        }

        .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #f5e6d3, #eed5b8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .badge {
            background: linear-gradient(135deg, #c87941, #a85e2a);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #8b4513;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #6b4c3b;
            font-weight: 400;
            line-height: 1.6;
            max-width: 320px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #c87941, #e8a87c);
            border-radius: 2px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #c87941, #a85e2a);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            padding: 1rem 2.2rem;
            border-radius: 50px;
            width: 100%;
            max-width: 340px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(168, 94, 42, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(168, 94, 42, 0.45);
        }

        .cta-btn:active {
            transform: translateY(0);
        }

        .note {
            font-size: 0.78rem;
            color: #a07860;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="card">
        <span class="badge">Tu compra fue confirmada</span>

        <div class="icon">🎉</div>

        <h1 class="title">¡Bienvenida al método!</h1>

        <div class="divider"></div>

        <p class="subtitle">
            Todos tus materiales están listos. Haz clic abajo para acceder a tu carpeta con los videos y archivos del curso.
        </p>

        <a
            href="https://drive.google.com/drive/folders/11miw1nACwaqndzkC-XKWHm6qIeevBWQj?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            class="cta-btn"
        >
            📁 Acceder a mis materiales
        </a>

        <p class="note">El enlace abre directamente en Google Drive</p>
    </div>
</body>

</html>
